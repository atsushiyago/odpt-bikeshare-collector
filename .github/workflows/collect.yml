name: Collect Bikeshare and Bus Delay Status

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-bikeshare
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gtfs-realtime-bindings

      - name: Run bikeshare collection script
        run: python collect.py

      - name: Run bus delay collection script
        env:
          YOKOHAMA_GTFS_RT_URL: ${{ secrets.YOKOHAMA_GTFS_RT_URL }}
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
        run: python collect_bus_delay.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bikeshare and bus delay status $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
